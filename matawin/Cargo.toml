[package]
name = "matawin"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = {version = "0.17.3", default-features = false, features = ["audio_thread_priority"] }
# image = "0.25.9"
mataimage = { path = "../mataimage", default-features = false, features = ["png", "bmp", "tga"]}
# kira = "0.12.0"
# rodio = "0.21.1"
symphonia = { version = "0.5.5", default-features = false, features = ["all-formats", "mpa", "flac", "vorbis", "pcm"] }
# libwayland-dev
# libwayland-client-extra++1
# Xwayland


[features]
default = ["x11"]



# Windowing Features
x11 = []
# Does not work yet and untested
wayland = []


[target.x86_64-unknown-linux-gnu.dependencies]
libc = "0.2.183"

[dev-dependencies]
rand = "0.9.2"
